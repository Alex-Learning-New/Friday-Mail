name: Friday Report Sender

on:
  schedule:
    - cron: '20 11 * * 6'   # Every Friday at 02:00 UTC (07:30 AM IST)
  workflow_dispatch:        # Allow manual trigger from GitHub Actions tab

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Send weekly report email
        env:
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER:        ${{ secrets.GMAIL_SENDER }}
          REPORT_RECIPIENT:    ${{ secrets.REPORT_RECIPIENT }}
          REPORT_SUBJECT:      ${{ secrets.REPORT_SUBJECT }}
        run: node scripts/send-report.js
